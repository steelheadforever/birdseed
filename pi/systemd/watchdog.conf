# Hardware watchdog. systemd drop-in:
#   installs to /etc/systemd/system.conf.d/watchdog.conf
#
# The Pi's SoC has a watchdog timer — a countdown that hardware-resets the
# board if it isn't petted in time. systemd (PID 1) opens /dev/watchdog and
# pets it at half the interval below; if the kernel or systemd ever wedges
# hard (the lockup we saw once during a camera restart), nothing pets it and
# the board reboots itself ~14 s later. True self-heal for a total hang, which
# the software net-check can't help with because it isn't running either.
#
# 14 s sits just under the bcm2835 watchdog's ~15 s hardware ceiling; systemd
# clamps anything larger. RebootWatchdogSec guards the *shutdown* path so a
# hung reboot still completes.
[Manager]
RuntimeWatchdogSec=14s
RebootWatchdogSec=2min
