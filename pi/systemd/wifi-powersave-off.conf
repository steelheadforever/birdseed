# Keep the Wi-Fi radio awake. NetworkManager drop-in:
#   installs to /etc/NetworkManager/conf.d/wifi-powersave-off.conf
#
# The Pi Zero 2 W's wireless chip defaults to power-save, which lets it doze
# the radio between packets. On an unattended feeder that saves a trickle of
# power but costs reliability: after a network blip (a router reboot, a power
# bump) the dozing radio sometimes fails to re-associate and the Pi sits there
# powered-but-offline until someone power-cycles it. We'd rather spend the
# milliwatts and stay reachable. 2 = disable powersave.
[connection]
wifi.powersave = 2
