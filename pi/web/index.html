<!DOCTYPE html>
<!--
  birdseed — phase 5 gallery (placeholder for the phase-6 PWA).

  This page is deliberately dumb: the Pi serves data (JSON) + static bytes;
  the client does the rendering. Same "dumb device, smart client" split as
  bird-ID-on-the-phone. No framework, no build step — one file you can read
  top to bottom.

  It's also deliberately lazy, because the server is a Pi Zero serving off an
  SD card. Three rules keep the load tiny:
    1. /api/days first (a few bytes) — sections render before any clip data.
    2. A day's clip list is fetched only when that day is opened.
    3. Cards are poster JPEGs (<img loading="lazy">, so only the visible ones
       are fetched). A <video> exists only after you tap a card — video bytes
       move only when someone is actually watching.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>birdseed</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 1.5rem;
      font: 16px/1.5 -apple-system, system-ui, sans-serif;
      background: #14171a; color: #e7e9ea;
    }
    header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    header .count { color: #8b98a5; font-size: .9rem; }
    #flip {
      margin-left: auto; cursor: pointer;
      font: inherit; font-size: .85rem; color: #e7e9ea;
      background: #1c2024; border: 1px solid #2a2f35; border-radius: 8px;
      padding: .3rem .7rem;
    }
    #flip[aria-pressed="true"] { background: #2a2f35; }
    /* The flip is pure presentation: the .mp4 bytes are untouched; the browser
       just draws every video upside-down. The camera's final mounting isn't
       decided yet, so orientation is a viewer setting, not a recorder setting.
       (New clips are flipped on the Pi itself; this stays for the old ones.) */
    body.flipped .clip video, body.flipped .clip img { transform: rotate(180deg); }
    /* Native controls render *inside* the <video>, so they flip with it.
       Counter-rotating the controls' shadow root puts them back upright.
       WebKit/Blink only — Firefox keeps upside-down controls, and iOS's
       native fullscreen player ignores page CSS entirely (inline playback
       is fine). Cosmetic either way: clicks still land correctly. */
    body.flipped .clip video::-webkit-media-controls { transform: rotate(180deg); }

    .day { margin-bottom: 1rem; }
    .day > button {
      /* The whole day header is the open/close control. */
      display: flex; align-items: baseline; gap: .6rem; width: 100%;
      cursor: pointer; text-align: left;
      font: inherit; color: inherit; background: none; border: none;
      padding: .5rem 0; border-top: 1px solid #2a2f35;
    }
    .day h2 { font-size: 1.05rem; margin: 0; }
    .day .daycount { color: #8b98a5; font-size: .85rem; }
    .day .chev { margin-left: auto; color: #8b98a5; transition: transform .15s; }
    .day[data-open] .chev { transform: rotate(90deg); }

    .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); padding: .25rem 0 .75rem; }
    .clip { background: #1c2024; border: 1px solid #2a2f35; border-radius: 12px; overflow: hidden; }
    .clip video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
    .poster {
      position: relative; display: block; width: 100%; padding: 0;
      cursor: pointer; background: #000; border: none; aspect-ratio: 16 / 9;
    }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .badge {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 2.2rem; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.7);
    }
    .poster.noimg .badge { color: #8b98a5; }
    .meta { padding: .6rem .8rem; display: flex; align-items: baseline; gap: .5rem; }
    .meta .when { font-weight: 600; }
    .meta .size { color: #8b98a5; margin-left: auto; }
    .meta .dl { color: #6bb1f4; text-decoration: none; }
    .meta .dl:hover { text-decoration: underline; }
    .empty, .error { color: #8b98a5; padding: 2rem 0; }
    .error { color: #f4736b; }
  </style>
</head>
<body>
  <header>
    <h1>🐦 birdseed</h1>
    <span class="count" id="count"></span>
    <button id="flip" aria-pressed="false" title="Rotate all clips 180°">⟲ flip view</button>
  </header>
  <div id="days"></div>
  <p class="empty" id="empty" hidden>No clips yet. Trip the sensor and one will show up here.</p>
  <p class="error" id="error" hidden></p>

  <script>
    // Orientation lives in the browser (localStorage), per the "dumb device"
    // split: the Pi records whatever the sensor sees; how it's displayed is the
    // client's problem. Once the camera is mounted for good, the recorder can
    // flip at capture time and this button becomes a no-op you leave off.
    const FLIP_KEY = "birdseed.flip";

    function applyFlip(on) {
      document.body.classList.toggle("flipped", on);
      document.getElementById("flip").setAttribute("aria-pressed", String(on));
    }

    document.getElementById("flip").addEventListener("click", () => {
      const on = !document.body.classList.contains("flipped");
      localStorage.setItem(FLIP_KEY, on ? "1" : "");
      applyFlip(on);
    });

    applyFlip(Boolean(localStorage.getItem(FLIP_KEY)));

    // The day section gives the date; cards only need the time of day.
    function timeLabel(iso) {
      if (!iso) return "unknown time";
      return new Date(iso).toLocaleTimeString(undefined, {
        hour: "numeric", minute: "2-digit", second: "2-digit",
      });
    }

    function dayLabel(day) {
      // day is YYYY-MM-DD. Parse at local noon — a bare date string parses as
      // UTC midnight, which renders as the previous day in western timezones.
      return new Date(day + "T12:00:00").toLocaleDateString(undefined, {
        weekday: "short", month: "short", day: "numeric",
      });
    }

    function clipCard(clip) {
      const card = document.createElement("div");
      card.className = "clip";

      // The card starts as a poster <img> (a few KB, lazily fetched). The
      // <video> — and any clip bytes at all — exist only after a tap.
      const poster = document.createElement("button");
      poster.className = "poster";
      poster.title = "Play clip";
      if (clip.thumb) {
        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = "";
        img.src = "/thumbs/" + encodeURIComponent(clip.thumb);
        // A listed thumb that 404s mid-flight (e.g. just pruned) degrades to
        // the same placeholder look as a clip with no poster at all.
        img.onerror = () => { img.remove(); poster.classList.add("noimg"); };
        poster.appendChild(img);
      } else {
        poster.classList.add("noimg");
      }
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "▶";
      poster.appendChild(badge);

      poster.addEventListener("click", () => {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.src = "/clips/" + encodeURIComponent(clip.name);
        poster.replaceWith(video);
      });
      card.appendChild(poster);

      const meta = document.createElement("div");
      meta.className = "meta";
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = timeLabel(clip.recorded_at);
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = clip.size_human;
      // Same URL the player streams from; the download attribute just tells
      // the browser to save the bytes instead of playing them. Handy for
      // pulling a clip onto the phone to rule out playback-side glitches.
      const dl = document.createElement("a");
      dl.className = "dl";
      dl.href = "/clips/" + encodeURIComponent(clip.name);
      dl.download = clip.name;
      dl.textContent = "download";
      meta.append(when, size, dl);
      card.appendChild(meta);

      return card;
    }

    function daySection(day) {
      const section = document.createElement("section");
      section.className = "day";

      const head = document.createElement("button");
      const title = document.createElement("h2");
      title.textContent = dayLabel(day.day);
      const daycount = document.createElement("span");
      daycount.className = "daycount";
      daycount.textContent = day.count + (day.count === 1 ? " clip" : " clips");
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "›";
      head.append(title, daycount, chev);
      section.appendChild(head);

      const grid = document.createElement("div");
      grid.className = "grid";
      grid.hidden = true;
      section.appendChild(grid);

      let loaded = false;
      async function open() {
        section.dataset.open = "";
        grid.hidden = false;
        if (loaded) return;
        loaded = true;  // one fetch per day, ever
        const res = await fetch("/api/clips?day=" + day.day);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const clips = await res.json();
        grid.replaceChildren(...clips.map(clipCard));
      }
      head.addEventListener("click", () => {
        if (section.dataset.open !== undefined) {
          delete section.dataset.open;
          grid.hidden = true;  // collapse only hides; nothing refetches
        } else {
          open().catch(showError);
        }
      });

      section.open = open;  // so load() can auto-open the newest day
      return section;
    }

    function showError(e) {
      const error = document.getElementById("error");
      error.textContent = "Couldn't reach the Pi: " + e.message;
      error.hidden = false;
    }

    async function load() {
      try {
        const res = await fetch("/api/days");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const days = await res.json();
        const total = days.reduce((n, d) => n + d.count, 0);
        document.getElementById("count").textContent =
          total + (total === 1 ? " clip" : " clips");
        document.getElementById("empty").hidden = days.length > 0;
        const sections = days.map((d) => daySection(d));
        document.getElementById("days").replaceChildren(...sections);
        if (sections.length) await sections[0].open();  // today opens itself
      } catch (e) {
        showError(e);
      }
    }

    load();
  </script>
</body>
</html>
